<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add Candidates</title>
        <link rel="stylesheet" href="../static/css/addCandidates.css">
    </head>
    <body>
        <h1>Add Candidate</h1>
        <div class="candidateSlot" id="candidateSlot">
            <form id="candidate-form" class="candidate-form" action="" method="POST" enctype="multipart/form-data">
                <fieldset id="fieldset">
                    <legend>Candidate 1</legend>
                    <div class="candidate" id="candidate">
                        <div class="information">
                            <label for="name">Candidate Name:</label><br>
                            <input type="text" name="names[]" required id="name"><br><br>

                            <label for="description">Candidate Description:</label><br>
                            <textarea 
                            id="description" 
                            name="descriptions[]" 
                            rows="5" 
                            cols="40" 
                            placeholder="Enter detailed description here..." 
                            required
                            ></textarea><br>
                        </div>

                        <div class="preview-box">
                            <label for="image_input">Select Candidate Image:</label><br>
                            <input type="file" id="candidate1-input" name="images[]" accept="image/*" required><br><br><br>

                            <span id="placeholder" class="placeholder-text">Image Selected:</span><br><br>
                            <img id="imagePreview" alt="Candidate Image Preview"><br><br><br>
                        </div>
                    </div>

                    <button type="button">Add Candidate To Election</button>

                </fieldset>
                <button type="button" id="addAnother">Add another candidate</button>
                <hr>
                <button type="submit" id="submitBtn">Submit Election</button>
            </form>
        </div>
        <script src="../static/js/addCandidate.js"></script>
    </body>

</html>
