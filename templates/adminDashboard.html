<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Dashboard</title>
        <link rel="stylesheet" href="../static/css/adminDashboard.css">
    </head>
    <body>
        <div class="top">
            <h1>Admin Dashboard</h1>
            <button class="logout" id="logoutBtn" type="button">Logout</button>
        </div>
        <dialog id="modal">
            <p>Are you sure you want to logout?</p>
            <button type="button" id="yesBtn" class="yesBtn">Yes</button>
            <button type="button" id="noBtn" class="noBtn">No</button>
        </dialog>
        <div class="buttons">
            <button class="add" type="button" id="create-election"><p>CREATE ELECTION</p><img src="../static/uploads/adminAdd.png" alt="Adding Election"><p>Set up a new voting environment</p></button>
            <button class="view" type="button" id="view-results"><p>VIEW RESULTS</p><img src="../static/uploads/adminView.png" alt="Adding Election"><p>Analyze voting data and tallies</p></button>
        </div>
    <script src="../static/js/adminDashboard.js"></script>
    </body>

</html>
